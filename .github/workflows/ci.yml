name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck integration test fixtures
        run: pnpm typecheck:e2e

      - name: Typecheck golden-query fixtures (D5.1)
        run: pnpm typecheck:golden

      - name: Unit tests (all packages, including empty stubs)
        run: pnpm test

      - name: Golden fixture + query-set tests (D5.1)
        run: pnpm test:golden

      # Workspace packages export dist/ — gate vitest resolves @codeoracle/*
      # via package.json exports (same as integration-test).
      - name: Build packages (for retrieval gates)
        run: pnpm build

      - name: Retrieval failure-class gates (E11)
        run: pnpm test:retrieval-gates

  compose-smoke-test:
    runs-on: ubuntu-latest
    # Prove Postgres/Redis/Qdrant come up healthy. Real product-path coverage
    # is the integration-test job below — this job only gates infra startup.
    steps:
      - uses: actions/checkout@v7

      - name: docker compose up
        working-directory: infra/compose
        run: docker compose up -d

      - name: Wait for services to be healthy
        working-directory: infra/compose
        run: |
          for i in $(seq 1 30); do
            unhealthy=$(docker compose ps --format json | grep -c '"Health":"healthy"' || true)
            total=$(docker compose ps --format json | wc -l)
            echo "Healthy: $unhealthy / $total"
            if [ "$unhealthy" -ge 3 ]; then
              echo "All services healthy."
              exit 0
            fi
            sleep 5
          done
          echo "Services did not become healthy in time."
          docker compose logs
          exit 1

      - name: Tear down
        if: always()
        working-directory: infra/compose
        run: docker compose down -v

  integration-test:
    runs-on: ubuntu-latest
    # Real product-path gate: full index -> embed -> extract -> retrieval
    # (search_codebase / find_decision / explain_file) against a scripted
    # local git repo and a fake OpenAI-compatible provider (test/e2e/fixtures)
    # — no Ollama/Gemini/Groq/OpenRouter/GitHub PAT, no network egress.
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Workspace packages export dist/ only — vitest resolves @codeoracle/*
      # via package.json exports, so build before migrate + e2e.
      - name: Build packages
        run: pnpm build

      - name: docker compose up (Postgres, Redis, Qdrant)
        working-directory: infra/compose
        run: docker compose up -d

      - name: Wait for services to be healthy
        working-directory: infra/compose
        run: |
          for i in $(seq 1 30); do
            healthy=$(docker compose ps --format json | grep -c '"Health":"healthy"' || true)
            if [ "$healthy" -ge 3 ]; then
              echo "All services healthy."
              exit 0
            fi
            sleep 5
          done
          echo "Services did not become healthy in time."
          docker compose logs
          exit 1

      - name: Run migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://codeoracle:change-me-in-dev@localhost:5432/codeoracle

      - name: Integration test (index → embed → extract → retrieve)
        run: pnpm test:integration
        env:
          DATABASE_URL: postgresql://codeoracle:change-me-in-dev@localhost:5432/codeoracle
          REDIS_URL: redis://localhost:6379
          QDRANT_URL: http://localhost:6333

      - name: Golden-query eval (D5.2 — hit@3 ≥80%, citation 100%)
        run: pnpm test:eval
        env:
          DATABASE_URL: postgresql://codeoracle:change-me-in-dev@localhost:5432/codeoracle
          REDIS_URL: redis://localhost:6379
          QDRANT_URL: http://localhost:6333

      - name: Tear down
        if: always()
        working-directory: infra/compose
        run: docker compose down -v

  dependency-audit:
    runs-on: ubuntu-latest
    # E10: fail on high/critical production advisories only. Policy:
    # docs/ops/dependency-audit.md
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (prod, high+)
        run: pnpm audit:ci

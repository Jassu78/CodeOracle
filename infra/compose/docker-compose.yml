# CodeOracle — core self-hosted stack (Postgres + Redis + Qdrant).
# Host apps: pnpm api / pnpm worker / pnpm mcp (see root README).
# Optional worker+API containers: docker-compose.full.yml --profile full.
#
# Target: runs on a 12GB Ampere OCI Always Free instance AND on a developer
# laptop. RAM budget comments below are rough sizing notes —
# verify on your own hardware before treating these as guarantees.
#
# Port conflict note: if you already run native Postgres/Redis/Qdrant on the
# default ports, Docker port-forward can silently lose on some hosts and
# clients will hit the WRONG service. Override before `docker compose up`:
#   POSTGRES_HOST_PORT=5433 REDIS_HOST_PORT=6380 docker compose up -d
# and update DATABASE_URL/REDIS_URL in your .env to match.

name: codeoracle

services:
  postgres:
    image: postgres:16-alpine
    container_name: codeoracle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codeoracle}
      POSTGRES_USER: ${POSTGRES_USER:-codeoracle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-dev}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # RAM budget: ~256-512MB idle for a single-repo MVP workload.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codeoracle} -d ${POSTGRES_DB:-codeoracle}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: codeoracle-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    # RAM budget: ~50-100MB for BullMQ queue traffic at MVP scale.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: codeoracle-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_HOST_PORT:-6333}:6333" # REST
      - "${QDRANT_GRPC_HOST_PORT:-6334}:6334" # gRPC
    volumes:
      - qdrantdata:/qdrant/storage
    # RAM budget: ~200-400MB for a small single-repo collection.
    # Qdrant's official image has neither wget nor curl, so the healthcheck
    # uses /dev/tcp (bash builtin) to confirm the REST port is accepting
    # connections — verified against a real container before pinning this.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  qdrantdata:

# Total estimated idle RAM for this slice: ~0.5-1GB. Full-stack estimate
# including api/worker/Ollama is ~2-3.5GB. Do not run a 7B+ local chat model
# alongside this stack on a 12GB box; keep it opt-in via providers.yaml.
